{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Shelter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body class="flex items-center justify-center min-h-screen" style="background-image: url('{% static 'allimage/loginimage.jpg' %}'); background-size: cover;">
  <div class="login-card">
    <div class="logo"><span>She</span><span class="highlight">lt</span><span>er</span> <span class="paw">🐾</span></div>
    <h2>Welcome Back</h2>
    <p>Enter your credentials to continue</p>
    <form id="loginForm">
      <input type="text" id="loginID" placeholder="Login ID" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e){e.preventDefault(); if(document.getElementById('loginID').value==='Om Sharma' && document.getElementById('password').value==='voank'){window.location.href='{% url 'project' %}'} else { alert('Invalid Login'); } });
  </script>
</body>
</html>
